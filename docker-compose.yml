services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # Defina JWT_SECRET (32+ caracteres) num arquivo .env ao lado deste compose; veja .env.example.
      Jwt__Secret: ${JWT_SECRET:?Defina JWT_SECRET no arquivo .env (veja .env.example)}
      ConnectionStrings__DefaultConnection: >-
        Host=postgres;Database=controle_financeiro;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: controle_financeiro
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
